[package]
name = "acp-desktop"
version = "0.1.0"
description = "Unofficial desktop ACP client"
authors = ["Andy115951 <129196310+Andy115951@users.noreply.github.com>"]
edition = "2021"

[lib]
name = "acp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol = "2.2.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tauri-plugin-dialog = "2.7.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
